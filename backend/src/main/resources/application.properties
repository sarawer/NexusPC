spring.application.name=nexuspc-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}
spring.datasource.hikari.connection-init-sql=SET SESSION sql_require_primary_key=0
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}

spring.jackson.serialization.write-dates-as-timestamps=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

bkash.enabled=${BKASH_ENABLED:false}
bkash.base-url=${BKASH_BASE_URL:https://tokenized.sandbox.bka.sh/v1.2.0-beta}
bkash.username=${BKASH_USERNAME:}
bkash.password=${BKASH_PASSWORD:}
bkash.app-key=${BKASH_APP_KEY:}
bkash.app-secret=${BKASH_APP_SECRET:}
bkash.callback-url=${BKASH_CALLBACK_URL:http://localhost:8080/api/payments/bkash/callback}
bkash.frontend-url=${FRONTEND_URL:http://localhost:3000}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}
